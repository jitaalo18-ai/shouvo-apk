name: Build debug APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Core unit tests (JVM)
        run: ./gradlew :core:test
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NockNock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK and source ZIP as a release (direct download links)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          LABEL=$(tr -d '[:space:]' < release_label.txt)
          APK="Nock_Nock_${LABEL}.apk"
          SRC="Nock_Nock_${LABEL}_source.zip"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          git archive --format=zip --prefix="NockNock_${LABEL}_source/" -o "$SRC" HEAD
          gh release create "v${VERSION}" "$APK" "$SRC" --title "Nock Nock ${LABEL}" \
            --notes "Debug APK and source code (version ${VERSION}) built by GitHub Actions run ${{ github.run_number }}." \
            || gh release upload "v${VERSION}" "$APK" "$SRC" --clobber
